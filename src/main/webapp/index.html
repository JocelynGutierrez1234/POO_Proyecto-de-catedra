<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taquicardia | Restaurante Mexicano</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/taquicardia.css">
    <style>
        .inicio { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
        .inicio__panel { width: min(100%, 1050px); overflow: hidden; border-radius: 1.5rem; box-shadow: var(--taq-shadow); background: var(--taq-paper); }
        .inicio__foto { min-height: 410px; color: white; display: flex; align-items: end; padding: clamp(1.5rem, 5vw, 3rem); background: linear-gradient(0deg, rgba(17,47,38,.88), rgba(17,47,38,.05)), url('assets/images/pexels-tacos.jpg') center 55% / cover; }
        .inicio__foto h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); line-height: 1; font-weight: 900; letter-spacing: -.05em; }
        .inicio__cuerpo { padding: clamp(1.5rem, 4vw, 2.5rem); }
    </style>
</head>
<body>
    <main class="inicio">
        <section class="inicio__panel">
            <div class="inicio__foto"><div><span class="eyebrow">COCINA MEXICANA · SABOR DE CASA</span><h1>Taquicardia</h1><p class="lead mb-0">Un lugar para compartir buenos sabores.</p></div></div>
            <div class="inicio__cuerpo d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div><h2 class="h4 mb-1" style="color:var(--taq-green-dark)">Sistema de gestión del restaurante</h2><p class="text-secondary mb-0">Administra el menú, las mesas, cocina y caja desde un mismo lugar.</p></div>
                <div class="d-flex flex-wrap gap-2"><a class="btn btn-verde btn-lg" href="MenuServlet">Abrir menú</a><a class="btn btn-outline-verde btn-lg" href="PedidoServlet?accion=listarMesas">Ir a mesas</a></div>
            </div>
        </section>
    </main>
</body>
</html>
